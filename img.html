<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Кто ты из вселенной Бурмалды?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a1a, #2d2d2d, #000000);
    color: #eee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 600px;
    width: 100%;
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid #888;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 30px #555;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 20px;
    color: #eee;
    text-shadow: 0 0 10px #555;
  }
  h2 {
    font-size: 26px;
    margin: 15px 0;
    color: #fff;
    text-shadow: 0 0 10px #666;
  }
  p { font-size: 18px; margin-bottom: 20px; }
  button {
    background: linear-gradient(135deg, #444, #666);
    color: white;
    border: none;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 8px 0;
    width: 100%;
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  button:hover {
    transform: scale(1.03);
    box-shadow: 0 0 20px #888;
  }
  #answers button {
    background: linear-gradient(135deg, #222, #444);
    border: 1px solid #888;
  }
  #answers button:hover {
    background: linear-gradient(135deg, #444, #666);
  }
  #result-img {
    max-width: 100%;
    width: 300px;
    border-radius: 20px;
    margin: 20px 0;
    box-shadow: 0 0 30px #555;
    animation: pop 0.5s ease;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  #progress { font-size: 14px; color: #aaa; margin-bottom: 15px; }
</style>
</head>
<body>
<div class="container">

  <div id="start-screen">
    <h1>Кто ты из вселенной Бурмалды?</h1>
    <p>Пройди тест и узнай ответ</p>
    <button onclick="startQuiz()">Начать обурмолжение</button>
  </div>

  <div id="quiz-screen" style="display:none;">
    <div id="progress"></div>
    <h2 id="question-text"></h2>
    <div id="answers"></div>
  </div>

  <div id="result-screen" style="display:none;">
    <img id="result-img" src="" alt="Результат">
    <h2 id="result-title"></h2>
    <p id="result-desc"></p>
    <button onclick="restart()">Пройти ещё раз</button>
  </div>

</div>

<script>
  const questions = [
    {
      text: "Как часто пьёшь чекушку?",
      answers: [
        { text: "Раз в день", character: "mellstroy" },
        { text: "Раз в неделю", character: "kotost" },
        { text: "Раз в месяц", character: "chekushka" },
        { text: "Вообще не пью", character: "not_burmalda" }
      ]
    },
    {
      text: "Котость разбила твою чекушку. Что делать?",
      answers: [
        { text: "Ничего, новую куплю", character: "chekushka" },
        { text: "Сначала проверю, не поранилась ли Котость", character: "drun" },
        { text: "Выгоню Котость из дома", character: "burmalda" },
        { text: "Запинаю ногами 💜", character: "mellstroy" }
      ]
    },
    {
      text: "Котость просит добавки. Что дашь?",
      answers: [
        { text: "Корм", character: "drun" },
        { text: "Чекушку", character: "kotost" },
        { text: "Обойдётся", character: "burmalda" }
      ]
    },
    {
      text: "Что для тебя главное?",
      answers: [
        { text: "Движуха", character: "kotost" },
        { text: "Чекушка", character: "chekushka" },
        { text: "Дота", character: "burmalda" },
        { text: "Карьера", character: "not_burmalda" }
      ]
    },
    {
      text: "Какой у тебя телефон?",
      answers: [
        { text: "Вечно разряженный", character: "mellstroy" },{ text: "С трещиной на экране", character: "chekushka" },
        { text: "С кучей мемов", character: "kotost" },
        { text: "С зарядкой для друга", character: "drun" },
        { text: "С непонятными приложениями", character: "burmalda" }
      ]
    },
    {
      text: "Что делаешь в 3 часа ночи?",
      answers: [
        { text: "Тусуюсь", character: "mellstroy" },
        { text: "Ищу чекушку", character: "chekushka" },
        { text: "Смотрю мемы с Котостью", character: "kotost" },
        { text: "Сплю", character: "not_burmalda" },
        { text: "Думаю о смысле жизни", character: "burmalda" }
      ]
    },
    {
      text: "Твой любимый звук?",
      answers: [
        { text: "Громкая музыка", character: "mellstroy" },
        { text: "Звон бокалов", character: "chekushka" },
        { text: "Мурчание Котости", character: "kotost" },
        { text: "Смех друга", character: "drun" },
        { text: "Тишина", character: "not_burmalda" }
      ]
    },
    {
      text: "Как ты относишься к Доте?",
      answers: [
        { text: "Играю каждый день", character: "burmalda" },
        { text: "Играл пару раз", character: "kotost" },
        { text: "Не играю", character: "not_burmalda" },
        { text: "Что это?", character: "chekushka" }
      ]
    }
  ];

  const results = {
    mellstroy: {
      img: "images/mellstroy.jpg",
      title: "Ты — Мелстрой!",
      desc: "Источник хаоса и движа. Вокруг тебя всегда что-то происходит."
    },
    chekushka: {
      img: "images/chekushka.jpg",
      title: "Ты — Чекушка!",
      desc: "Маленькая, но мощная. С тобой весело, но утром может быть больно."
    },
    kotost: {
      img: "images/kotost.jpg",
      title: "Ты — Котость!",
      desc: "Движуха и веселье. Ты заряжаешь всех вокруг энергией."
    },
    drun: {
      img: "images/drun.jpg",
      title: "Ты — Тёмный Друн!",
      desc: "Верный друг, но с тёмной стороной. Всегда рядом, когда вокруг полная бурмалда."
    },
    burmalda: {
      img: "images/burmalda.jpg",
      title: "Ты — Заяц Бурмалдаец!",
      desc: "Загадка вселенной. Никто не знает, что ты такое, но без тебя скучно."
    },
    not_burmalda: {
      img: "images/not_burmalda.jpg",
      title: "Ты вообще не Бурмалда!",
      desc: "Ты случайно тут оказалась. Но раз уж зашла — оставайся."
    }
  };

  let currentQuestion = 0;
  let scores = {};

  function startQuiz() {
    currentQuestion = 0;
    scores = { mellstroy: 0, chekushka: 0, kotost: 0, drun: 0, burmalda: 0, not_burmalda: 0 };
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    showQuestion();
  }

  function showQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('progress').textContent = 'Вопрос ' + (currentQuestion + 1) + ' из ' + questions.length;
    document.getElementById('question-text').textContent = q.text;
    const answersDiv = document.getElementById('answers');
    answersDiv.innerHTML = '';
    q.answers.forEach(function(ans) {
      const btn = document.createElement('button');
      btn.textContent = ans.text;
      btn.onclick = function() { chooseAnswer(ans.character); };
      answersDiv.appendChild(btn);
    });
  }

  function chooseAnswer(character) {
    scores[character]++;
    currentQuestion++;
    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    let winner = 'burmalda';
    let max = -1;
    for (const key in scores) {
      if (scores[key] > max) {
        max = scores[key];
        winner = key;
      }
    }
    const r = results[winner];
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('result-img').src = r.img;
    document.getElementById('result-title').textContent = r.title;
    document.getElementById('result-desc').textContent = r.desc;
  }function restart() {
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'block';
  }
</script>
</body>
</html>
